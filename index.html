<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aura</title>
<style>body{margin:0;background:#070b14;color:#94a3b8;font-family:system-ui;display:grid;place-items:center;min-height:100vh}</style>
</head>
<body>
<div id="s">Loading Aura…</div>
<script>
(async()=>{
  try{
    const n = 6;
    let b64 = '';
    for(let i=0;i<n;i++){
      const t = await fetch('./part'+i+'.txt').then(r=>r.text());
      b64 += t.trim();
    }
    const html = decodeURIComponent(escape(atob(b64)));
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('s').textContent = 'Load failed: '+e.message;
  }
})();
</script>
</body>
</html>
