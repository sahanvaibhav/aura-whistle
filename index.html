<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#070b14">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://*.googleusercontent.com https://www.gstatic.com https://*.ggpht.com; media-src 'self' blob: https://interactive-examples.mdn.mozilla.net https://www.w3schools.com; connect-src 'self' https://www.googleapis.com https://generativelanguage.googleapis.com https://api.duckduckgo.com https://api.open-meteo.com https://accounts.google.com; frame-src https://accounts.google.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests">
<title>Aura — Whistle</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg1:#070b14;--bg2:#0c1220;--card:rgba(255,255,255,.07);--border:rgba(255,255,255,.12);--text:#f1f5f9;--muted:#8b92a7;--cyan:#22d3ee;--blue:#3b82f6;--purple:#8b5cf6;--green:#10b981;--red:#ef4444;--radius:18px;--glass:rgba(12,18,32,.62)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05070d;color:var(--text)}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:12px}
.phone{width:420px;height:900px;max-width:100vw;max-height:100vh;border:1px solid var(--border);border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:linear-gradient(165deg,var(--bg1),var(--bg2));box-shadow:0 30px 80px rgba(0,0,0,.5)}
.hdr{padding:14px;display:flex;align-items:center;gap:8px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px;background:linear-gradient(120deg,#fff,var(--cyan),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pill{flex:1;height:36px;border-radius:999px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;gap:6px;padding:0 12px;font-size:12px;color:var(--muted);cursor:pointer;min-width:0}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;display:grid;place-items:center}
.av{width:36px;height:36px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--purple),var(--cyan))}
.av img{width:100%;height:100%;object-fit:cover}
.live{padding:0 14px 8px;font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:p 1.5s infinite}
@keyframes p{50%{opacity:.4}}
.clk{margin-left:auto;color:var(--cyan);font-variant-numeric:tabular-nums}
.main{flex:1;overflow:auto;padding:4px 14px 96px}
.main::-webkit-scrollbar{width:0}
.page{display:none;animation:up .25s ease}
.page.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow:auto}
.tab{padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--cyan);color:#06202a;border-color:transparent}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.h{font-size:14px;font-weight:700}.s{font-size:11px;color:var(--muted);margin:2px 0 10px}
.greet{font-size:20px;font-weight:700}.sub{font-size:12px;color:var(--muted);margin:2px 0 12px}
.inp{width:100%;border:1px solid var(--border);background:rgba(0,0,0,.2);border-radius:14px;padding:11px 14px;color:var(--text);outline:none;font-size:13px;margin-bottom:8px}
.short{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--border);background:#000;margin-bottom:12px;min-height:420px}
.short video,.ph{width:100%;height:420px;object-fit:cover;display:block}
.ph{background-size:cover;background-position:center}
.grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),transparent 55%);pointer-events:none}
.meta{position:absolute;left:14px;right:60px;bottom:14px;color:#fff;z-index:2}
.meta b{display:block;font-size:13px;margin-bottom:4px}
.meta span{font-size:12px;line-height:1.35}
.acts{position:absolute;right:10px;bottom:80px;display:flex;flex-direction:column;gap:10px;z-index:3}
.sb{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.14);backdrop-filter:blur(12px);color:#fff;display:grid;place-items:center;cursor:pointer}
.gbuf{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,11,20,.35);backdrop-filter:blur(10px);z-index:4}
.ring{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.12);border-top-color:var(--cyan);animation:spin .85s linear infinite;box-shadow:0 0 20px rgba(34,211,238,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
.composer textarea{width:100%;min-height:80px;border-radius:14px;border:1px solid var(--border);background:rgba(0,0,0,.2);color:var(--text);padding:12px;font-size:13px;resize:vertical;outline:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{border:none;border-radius:14px;padding:11px 16px;font-weight:700;font-size:13px;cursor:pointer}
.bp{background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff}
.bg{background:var(--card);color:var(--text);border:1px solid var(--border)}
.post{border:1px solid var(--border);background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.ph2{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan))}
.pb{font-size:13.5px;line-height:1.45;white-space:pre-wrap;margin-bottom:8px}
.pm{width:100%;border-radius:12px;max-height:220px;object-fit:cover;margin-bottom:8px}
.pa{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.pa button{background:none;border:none;color:inherit;cursor:pointer}
.contact{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;cursor:pointer}
.contact:hover{background:rgba(255,255,255,.04)}
.cav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;position:relative}
.d{position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg1);background:var(--green)}
.msgs{display:flex;flex-direction:column;gap:6px;min-height:240px;max-height:340px;overflow:auto}
.m{max-width:78%;padding:10px 12px;border-radius:16px;font-size:13px}
.mi{align-self:flex-start;background:var(--card)}.mo{align-self:flex-end;background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff}
.ci{display:flex;gap:6px;margin-top:10px}
.ci input{flex:1;border-radius:999px;border:1px solid var(--border);background:rgba(0,0,0,.2);color:var(--text);padding:11px 14px;outline:none}
.send{width:40px;height:40px;border:none;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dev{padding:12px;border-radius:16px;border:1px solid var(--border);background:var(--card)}
.sw{width:36px;height:20px;background:#334155;border-radius:20px;position:relative;cursor:pointer}
.sw.on{background:linear-gradient(135deg,var(--purple),var(--cyan))}
.sw:after{content:"";width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.2s}
.sw.on:after{left:18px}
.gpay{padding:16px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,rgba(30,41,59,.92),rgba(15,23,42,.96));color:#fff;margin-bottom:12px}
.bv{font-size:28px;font-weight:800;margin:4px 0 12px}
.ba{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ba button{background:none;border:none;color:#fff;cursor:pointer;font-size:10px}
.ba i{display:grid;place-items:center;width:40px;height:40px;margin:0 auto 4px;border-radius:50%;background:rgba(34,211,238,.15);border:1px solid rgba(34,211,238,.25);font-style:normal;color:var(--cyan)}
.tx{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.tx:last-child{border-bottom:0}
.green{color:var(--green)}.red{color:var(--red)}
.navb{position:absolute;bottom:0;left:0;right:0;height:70px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--border);background:var(--glass);backdrop-filter:blur(20px);z-index:20}
.nav{color:var(--muted);font-size:10px;text-align:center;cursor:pointer;padding:6px}
.nav span{display:block;font-size:16px;margin-bottom:2px}
.nav.on{color:var(--cyan);font-weight:700}
.modal{position:absolute;inset:0;display:none;align-items:flex-end;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);z-index:50}
.modal.on{display:flex}
.mbox{width:100%;max-height:85%;overflow:auto;background:var(--bg2);border-top:1px solid var(--border);border-radius:22px 22px 0 0;padding:18px}
.x{float:right;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.toast{position:absolute;left:50%;bottom:82px;transform:translateX(-50%) translateY(8px);background:var(--bg2);border:1px solid var(--border);padding:10px 16px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:80;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ov{position:absolute;inset:0;display:none;flex-direction:column;background:rgba(7,11,20,.95);backdrop-filter:blur(16px);z-index:70;padding:14px}
.ov.on{display:flex}
.modes{display:flex;gap:6px;margin:10px 0}
.mode{flex:1;padding:9px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;text-align:center}
.mode.on{background:rgba(34,211,238,.14);color:var(--cyan);border-color:rgba(34,211,238,.35)}
.box{flex:1;overflow:auto;border:1px solid var(--border);border-radius:16px;background:var(--card);padding:12px;font-size:13px;line-height:1.5}
.ri{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.ri a{color:var(--cyan);font-weight:600;text-decoration:none}
.ri p{color:var(--muted);font-size:12px;margin-top:3px}
.prof{text-align:center;padding:8px 0 14px}
.pav2{width:72px;height:72px;margin:0 auto 10px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;background:linear-gradient(135deg,var(--purple),var(--cyan))}
.pav2 img{width:100%;height:100%;object-fit:cover}
#gbtn{display:flex;justify-content:center;min-height:44px;margin:8px 0}
.hint{font-size:11px;color:var(--muted);line-height:1.45;margin-top:8px}
.mi{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;background:rgba(34,211,238,.15);color:var(--cyan);margin-left:6px}
.ok{color:var(--green)}.warn{color:#f59e0b}
@media(max-width:480px){body{padding:0}.phone{width:100%;height:100vh;max-height:100%;border-radius:0;border:none}}
</style>
</head>
